[project]
name = "exulanica-agent"
version = "0.1.0"
description = "Give any AI agent a body in an Exulanica world, through the world's door"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
# The library is the Python standard library only; the MCP facade alone needs the MCP SDK.
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=2.3.0,<3"]

[project.scripts]
exulanica-agent = "exulanica_agent.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["exulanica_agent"]
