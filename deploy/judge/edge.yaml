# The public edge for the judge stack: an overlay on `compose.yaml` in this directory, used as
#
#   docker compose -f deploy/judge/compose.yaml -f deploy/judge/edge.yaml ...
#
# and normally through `stack.sh` beside it, which supplies the environment. It adds one service,
# a TLS-terminating reverse proxy in front of `web`, and gives the long-running services a restart
# policy and bounded logs. Everything else is the judge stack unchanged: the same five services,
# the same roles, the same single origin.
#
# WHY AN EDGE AT ALL. The client refuses every region when `crypto.subtle` is absent, and a browser
# gives SubtleCrypto to a secure context only. A judge on another machine therefore needs HTTPS,
# not a wider bind on `web`. `web` keeps its loopback-only port; the edge reaches it over the
# compose network.
#
# WHY IT PROXIES TO `web` AND NEVER TO `api`. `web` holds the single-origin `/api` prefix strip and
# the per-address write limit. An edge that reached `api` directly would bypass both.
#
# Like the rest of `deploy/judge/`, nothing here names a cloud, a region, a host or an account.
# The host name and the certificate issuer are environment values with no default.

services:
  edge:
    # An exact version, as the stack pins PostgreSQL: a moving tag is a proxy that changes under a
    # running demonstration.
    image: caddy:2.11.4-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
    restart: unless-stopped
    ports:
      # The bind address has no default. A public host states 0.0.0.0; a rehearsal on a laptop
      # states 127.0.0.1 and ports of its own, so nobody opens 80 and 443 on a shared machine by
      # leaving a variable unset.
      - "${EXULANICA_EDGE_ADDRESS:?set EXULANICA_EDGE_ADDRESS; 0.0.0.0 on a public host, 127.0.0.1 in a rehearsal}:${EXULANICA_EDGE_HTTP_PORT:-80}:80"
      - "${EXULANICA_EDGE_ADDRESS:?set EXULANICA_EDGE_ADDRESS; 0.0.0.0 on a public host, 127.0.0.1 in a rehearsal}:${EXULANICA_EDGE_HTTPS_PORT:-443}:443"
    environment:
      # Read by the Caddyfile. No default for either: the host name is the one judges open, and the
      # issuer decides whether a public authority is asked for a certificate.
      EXULANICA_PUBLIC_HOST: ${EXULANICA_PUBLIC_HOST:?set EXULANICA_PUBLIC_HOST to the host name judges open}
      EXULANICA_TLS: ${EXULANICA_TLS:?set EXULANICA_TLS to an ACME contact email, or internal for a rehearsal}
    volumes:
      # Relative to this directory, which is also the directory of the first compose file.
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # The issued certificate and the account key. Kept across restarts so a restart does not ask
      # the certificate authority again and meet its rate limit.
      - edge_data:/data
      - edge_config:/config
    logging: &bounded-logs
      driver: json-file
      options:
        # Ten files of 10 MB per service. A log that grows until the disk fills stops PostgreSQL
        # first, which is the worst service to lose.
        max-size: "10m"
        max-file: "10"
    depends_on:
      - web

  postgres:
    restart: unless-stopped
    logging: *bounded-logs

  api:
    restart: unless-stopped
    logging: *bounded-logs

  web:
    restart: unless-stopped
    logging: *bounded-logs

  # `migrate` and `seed` stay one-shot, with no restart policy: a seed that restarted would restore
  # the archive over the world a judge is using.

volumes:
  edge_data:
  edge_config:
