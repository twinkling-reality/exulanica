# The addresses whose X-Forwarded-For the client proxy trusts, included by its configuration: the
# private ranges a container network is drawn from. The public composition replaces this file with
# its edge's one fixed address (deploy/public/client-trusted-proxies.conf).
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
