# The public server: an overlay on the repository's `compose.yaml`, used as
#
#   docker compose -f compose.yaml -f deploy/public/public.yaml ...
#
# and normally through `public.sh` beside it, which supplies the environment. docs/deployment.md
# section 8.2 is the runbook.
#
# WHAT IT ADDS TO THE INSTALLATION. A TLS edge in front of the installation's own client proxy, the
# one way in from outside; the API's published port taken away; durable spending; the process's
# model ceilings stated by the operator; one image name per recipe, and the database and edge
# images under names of their own, so a host loads six images and never pulls one
# (`pull_policy: never` on every service); the generated-tile worker; bounded logs on every
# long-running service.
#
# WHY THE INSTALLATION AND NOT THE REVIEWER STACK. Visitors make worlds of their own, choose the
# models that run their people and compare them. The reviewer stack serves one seeded workspace
# through a role that registers no world, so none of that works there (docs/judge-access.md).
#
# WHY THE EDGE PROXIES TO `client` AND NEVER TO `api`. `client` holds the single-origin `/api`
# prefix strip, the per-address write limit and the problem shape of its own refusals. An edge
# that reached `api` directly would bypass all three.
#
# Like `compose.yaml`, nothing here names a cloud, a region, a host or an account: the host name,
# the certificate issuer and the edge's bind address are environment values with no default.

services:
  edge:
    # The reviewer edge's exact Caddy, pulled by digest on the build host and loaded here under
    # this name (public.sh, edge_source): a moving tag is a proxy that changes under a running
    # server, and a pull on the host would run an image nobody compared.
    image: exulanica-public-edge
    pull_policy: never
    restart: unless-stopped
    ports:
      # No default for the address. A public host states 0.0.0.0; a rehearsal states 127.0.0.1 and
      # ports of its own, so nobody opens 80 and 443 on a shared machine by leaving it unset.
      - "${EXULANICA_EDGE_ADDRESS:?set EXULANICA_EDGE_ADDRESS; 0.0.0.0 on a public host, 127.0.0.1 in a rehearsal}:${EXULANICA_EDGE_HTTP_PORT:-80}:80"
      - "${EXULANICA_EDGE_ADDRESS:?set EXULANICA_EDGE_ADDRESS; 0.0.0.0 on a public host, 127.0.0.1 in a rehearsal}:${EXULANICA_EDGE_HTTPS_PORT:-443}:443"
    environment:
      EXULANICA_PUBLIC_HOST: ${EXULANICA_PUBLIC_HOST:?set EXULANICA_PUBLIC_HOST to the host name visitors open}
      # How the edge gets its certificate, as the Caddyfile's one line: `tls internal` for a
      # rehearsal, `tls <email>` for a public authority with a contact, or empty for a public
      # authority with none (Caddy's automatic HTTPS). `init` writes it from EXULANICA_TLS, which
      # it checks is one of those; set but empty is allowed, unset is refused.
      EXULANICA_TLS_DIRECTIVE: ${EXULANICA_TLS_DIRECTIVE?run public.sh init, which writes EXULANICA_TLS_DIRECTIVE from EXULANICA_TLS}
    volumes:
      # Relative to the project directory, which is the first compose file's: the repository root
      # on the build host and the copied layout on the server alike.
      - ./deploy/public/Caddyfile:/etc/caddy/Caddyfile:ro
      # The issued certificate and the account key, kept across restarts so a restart does not ask
      # the certificate authority again and meet its rate limit.
      - edge_data:/data
      - edge_config:/config
    # A fixed address, the one the client proxy trusts X-Forwarded-For from
    # (client-trusted-proxies.conf).
    networks:
      default:
        ipv4_address: 10.231.89.10
    logging: &bounded-logs
      driver: json-file
      options:
        # Ten files of 10 MB per service. A log that grows until the disk fills stops PostgreSQL
        # first, which is the worst service to lose.
        max-size: "10m"
        max-file: "10"
    depends_on:
      - client

  postgres:
    # compose.yaml's pgvector image, pulled by digest on the build host (public.sh,
    # postgres_source) and loaded under this name.
    image: exulanica-public-postgres
    pull_policy: never
    logging: *bounded-logs

  restore-marker:
    image: exulanica-public-backend
    pull_policy: never

  migrate:
    image: exulanica-public-backend
    pull_policy: never

  catalogs:
    image: exulanica-public-backend
    pull_policy: never

  api:
    image: exulanica-public-backend
    pull_policy: never
    # The installation publishes the API's port for a host that puts its own proxy in front. Here
    # the edge is that proxy, and a published API port would be a second way in that skips the
    # client proxy's write limit and body cap. `!reset` removes the base file's list.
    ports: !reset []
    environment:
      # Every attempt is admitted by the durable spending authority as well as this process's own
      # fuse (docs/model-spending-contract.md): the authority is the money and survives restarts;
      # the fuse stops a runaway loop. No `process` mode on a server anybody can reach.
      EXULANICA_SPENDING: durable
      # The process fuse: no default here, although the API has one, because the figure is the
      # operator's to state. Each is a ceiling for one process life.
      EXULANICA_BUDGET_USD: ${EXULANICA_BUDGET_USD:?set EXULANICA_BUDGET_USD; this server states its process model spend ceiling}
      EXULANICA_BUDGET_MAX_CALLS: ${EXULANICA_BUDGET_MAX_CALLS:?set EXULANICA_BUDGET_MAX_CALLS; this server states its process model call ceiling}
      # Browser accounts on the account role, for the guest entry: the one origin visitors open.
      EXULANICA_ACCOUNT_DATABASE_URL: postgresql://exulanica_accounts:${EXULANICA_ACCOUNT_ROLE_PASSWORD}@postgres:5432/${POSTGRES_DB:-exulanica}
      EXULANICA_ACCOUNT_BROWSER_ORIGINS: '["${EXULANICA_PUBLIC_ORIGIN:?set EXULANICA_PUBLIC_ORIGIN to the https origin visitors open}"]'
      # uvicorn takes the scheme from X-Forwarded-Proto, and the client's address from
      # X-Forwarded-For, only from the address named here: the client proxy's fixed one. A process
      # on the host that reaches the API at its bridge address comes from the network's gateway and
      # is taken as it is, plain http from that address.
      FORWARDED_ALLOW_IPS: "10.231.89.20"
      # Every account workspace plays, and its people's chosen models are asked under its own
      # grant: the owners', and the guests' while they are there (docs/deployment.md 5.1.5). This
      # process plays them (EXULANICA_PLAYBACK_WORKER stays on), so the guests' settings above
      # reach the player.
      EXULANICA_SOCIETY_CONTROL_WORKER: "on"
      EXULANICA_PLAYBACK_WORKER: "on"
      # Whether societies of things are made through the routes here, off unless public.env says
      # `EXULANICA_SOCIETY_OF_THINGS=on`. On, a guest's arrival world is dressed with the scene the
      # arrival list names (exulanica/api/arrival_dressing.py), whose beings live in a society of
      # things; off, it opens undressed and the entry names the step. The first society of things
      # a non-rehearsal server plays fixes how its engine version must replay, so it is turned on
      # deliberately. Only the API makes a society; every other container leaves it unset.
      EXULANICA_SOCIETY_OF_THINGS: ${EXULANICA_SOCIETY_OF_THINGS:-off}
    # A fixed address too. The client proxy finds `api` by name once, when it starts; an `up` that
    # recreates the API beside other containers, or a host restart, can otherwise give it a new
    # address, and the proxy then answers 502 for every API path while the API is well.
    networks:
      default:
        ipv4_address: 10.231.89.30
    logging: *bounded-logs

  preparation:
    image: exulanica-public-backend
    pull_policy: never
    logging: *bounded-logs

  playback-worker:
    image: exulanica-public-backend
    pull_policy: never
    environment:
      EXULANICA_SPENDING: durable
    logging: *bounded-logs

  maintenance:
    image: exulanica-public-maintenance
    pull_policy: never
    logging: *bounded-logs

  restore:
    image: exulanica-public-maintenance
    pull_policy: never

  client:
    image: exulanica-public-client
    pull_policy: never
    # The edge reaches the client proxy over the compose network. A published port would be a way
    # in beside the edge, where a local process could write its own X-Forwarded-For and
    # X-Forwarded-Proto, which this proxy trusts from private ranges. `up` checks the merged
    # configuration publishes neither this port nor the API's.
    ports: !reset []
    # Trusts X-Forwarded-For from the edge's address alone, not from the private ranges the image
    # trusts: on a Linux host a local process reaches this proxy at its bridge address, from the
    # network's gateway, and would otherwise choose the address a guest entry is counted by.
    volumes:
      - ./deploy/public/client-trusted-proxies.conf:/etc/nginx/exulanica-trusted-proxies.conf:ro
    # A fixed address, the one the API trusts forwarded headers from.
    networks:
      default:
        ipv4_address: 10.231.89.20
    logging: *bounded-logs

  # Bakes the tiles of the towns visitors make, and of the arrival worlds once, as the tile role.
  # public.sh starts it with the `tiles` compose profile, under the `public` installation profile,
  # where the worker refuses any wider publisher than the tile role.
  tile-worker:
    image: exulanica-public-tiles
    pull_policy: never
    environment:
      # A visitor's towns are baked too: the workspaces active accounts, guests among them, own.
      EXULANICA_ACCOUNT_DATABASE_URL: postgresql://exulanica_accounts:${EXULANICA_ACCOUNT_ROLE_PASSWORD}@postgres:5432/${POSTGRES_DB:-exulanica}
    logging: *bounded-logs

volumes:
  edge_data:
  edge_config:

# One network with a fixed range, so the edge and the client proxy keep the addresses the trust
# settings name, and the API keeps the one the client proxy found at its start. A host that already
# uses this range for something else changes every place that names it together: the subnet here,
# the edge's, the client's and the API's addresses, the API's FORWARDED_ALLOW_IPS and
# client-trusted-proxies.conf.
networks:
  default:
    ipam:
      config:
        - subnet: 10.231.89.0/24
