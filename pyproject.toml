[project]
name = "exulanica"
version = "0.1.0"
description = "Exulanica: a personal world memory model with an evidence-addressed spine."
requires-python = ">=3.11,<3.12"
license = { file = "LICENSE" }

# Deliberately minimal. Each entry is justified:
#   pydantic  - boundary schemas (HTTP request/response, model json_schema strict payloads).
#               NOT used for the evidence spine types in exulanica.evidence: those are frozen
#               dataclasses with explicit validation, because coercion is a hazard for values
#               that feed a hash (see exulanica/canonical.py).
#   pillow    - JPEG/PNG decode, EXIF, and the orientation transform at ingest. Orientation is
#               eight values including four mirrored ones, and ImageOps.exif_transpose is the
#               reference implementation of that table; a hand-rolled version would be a
#               subtle wrong-axis bug in a photograph corpus.
#   httpx     - the Token Factory HTTP client. Chosen over the openai SDK because the only
#               thing needed is one POST, and over urllib because MockTransport lets the
#               retry, failover and truncation paths be tested without a network or a
#               credential.
#   fastapi   - the HTTP surface. Chosen over Starlette alone because every request and
#               response body in this API is already a Pydantic model and the integration is
#               the entire value; chosen over Django and Flask because the application needs
#               routing, validation and an OpenAPI document and nothing else, and an ORM here
#               would be a second way to reach the schema that the spine's triggers guard.
#               uvicorn is the server and is a dev-group dependency, because a deployment may
#               prefer a different ASGI server and the library must not force one.
#   psycopg   - PostgreSQL 18 is the only data layer. It was optional while a portable SQLite
#               mirror carried the ingest path; the mirror is deleted, so nothing in this
#               package runs without a database and pretending otherwise would just move the
#               failure to a later import.
#   cryptography - Ed25519 signing and verification for World Memory Package roots.  The
#               package verifier uses the reviewed RFC 8032 primitive rather than carrying a
#               handwritten elliptic-curve implementation in the data portability boundary.
dependencies = [
  # Google OIDC protocol and JOSE verification, with injectable HTTP for signed-provider tests.
  "authlib==1.8.0",
  "cryptography>=43",
  "fastapi>=0.115",
  "httpx>=0.27",
  "httpx2==2.12.0",
  "joserfc==1.7.5",
  "jsonschema>=4.23",
  "pillow>=12.3.0",
  "pi-heif==1.4.0",  # decode-only HEIF wheel; bundled LGPL libraries in license matrix
  "psycopg[binary]>=3.2",
  "pydantic>=2.9",
  # `POST /intake` is multipart, and Starlette parses multipart only when this is installed. It
  # is a hard dependency rather than an extra because the route is part of the surface: an
  # instance that could not accept an upload would serve a documented endpoint that raises.
  "python-multipart>=0.0.20",
]

# Reconstruction, and why it is optional rather than a dependency.
#
# MoGe-2 is MIT and is the selected monocular depth model, but installing it means torch and a
# 1.3 GB checkpoint, and MoGe 3.0.0 declares far more than it loads: `torchvision>=0.19`, gradio,
# trimesh, matplotlib, a git `pipeline` and a git `flex-gemm` that needs triton, and triton has
# no macOS wheel at all. So MoGe is locked WITHOUT its declared dependencies and with the six it
# actually imports at run time listed here. The override that does that is
# `[[tool.uv.dependency-metadata]]` under `[tool.uv]` below, next to the torch index arrangement
# that keeps this one lock installable on both macOS and Linux.
# `utils3d_moge` is a different package from the `utils3d` on PyPI, which is an unrelated stub;
# installing that one fails a long way from the cause, with `module 'utils3d' has no attribute
# 'pt'`.
#
# An instance without this extra still ingests a corpus and reports the depth stage as not run,
# which is the same arrangement the vision stage has. A pipeline that could not run without a
# checkpoint is a pipeline that does not run.
[project.optional-dependencies]
# The ASGI server an IMAGE picks. uvicorn stays out of the library's hard dependencies for the
# reason recorded above, that a deployment may prefer a different server and the library must not
# force one. An image IS a deployment and has to pick one, and an extra is how it picks one while
# still being covered by uv.lock. Installing it with `uv pip install` after the sync would work
# and would not be lock-checked, which is why it is not done that way.
server = [
  "uvicorn>=0.30",
]
reconstruction = [
  "torch>=2.5",
  "numpy>=1.26",
  "opencv-python-headless>=4.10",
  "scipy>=1.11",
  "moge @ git+https://github.com/microsoft/MoGe.git@74fbce054ebed49800de42d0ad0e83495065719a",
  "utils3d_moge @ git+https://github.com/EasternJournalist/utils3d-moge.git@62f09d58509485564e24d5d9f6aac9ee9ebc0c37",
  "huggingface_hub>=0.26",
]
# Pose recovery, deliberately its own extra rather than part of `reconstruction`.
#
# `pycolmap` publishes a macOS arm64 wheel, needs no CUDA and pulls no torch, so it installs where
# the depth stack cannot and must not be entangled with the platform-forked torch arrangement in
# `[tool.uv]` below. Keeping it separate means an instance can recover camera poses without
# installing a 1.3 GB checkpoint, and the depth extra keeps resolving if this one ever cannot.
#
# The version is pinned rather than lower-bounded because it is the backend an in-process
# reconstruction runs, and the receipt records which version produced a pose. VERIFIED 2026-09-02:
# 4.2.0 ships `macosx_14_0_arm64` wheels for CPython 3.10 through 3.14 and reports `has_cuda`
# False, so the wheel is a CPU build on this platform.
pose = [
  "pycolmap==4.2.0",
]
# Object segmentation, its own extra for the reason `pose` is: an instance can run depth without
# it, and this one must not be entangled with anything the depth stack cannot install.
#
# SAM 2.1 masks objects and Grounding DINO, with OWLv2 behind it, proposes boxes when the hosted
# vision pass has none, all three locally (docs/scene-segments.md). transformers is pinned exactly
# rather than lower-bounded because its processors decide the pixels a model reads, and the stage
# records the version beside the checkpoint revisions it loaded.
#
# torchvision is deliberately NOT here. transformers 5.17 imports it at module level in the SAM 2
# image processor and in the fast Grounding DINO and OWLv2 processors, and adding it would mean a
# second platform-forked source beside torch's below. The stage drives `Sam2Model` from the
# checkpoint's own preprocessor configuration and uses the PIL processors for the two detectors,
# so no module this extra loads imports torchvision. VERIFIED 2026-09-11 against the wheel.
segmentation = [
  "torch>=2.5",
  "numpy>=1.26",
  "opencv-python-headless>=4.10",
  "huggingface_hub>=0.26",
  "transformers==5.17.0",
]

[project.scripts]
# Scene-specific Gaussian training uses the manifest's digest-pinned CUDA container.
exulanica-gsplat-scene-v1 = "exulanica.reconstruction.gsplat_container:main"
# `uv run exulanica-ingest ingest ./photos`. Safe to run repeatedly: the second run reports what
# it skipped and issues no model calls.
exulanica-ingest = "exulanica.ingest.cli:main"
# `uv run exulanica-preflight`. Checks every model identifier the manifest can reach against the
# live catalog. Exit 0 clean, 1 on any failure, so CI and the weekly uptime check on a running
# deployment can both call it without parsing output. `--catalog-file` checks a saved snapshot
# instead of the network, which is how the offline test runs it.
exulanica-preflight = "exulanica.models.preflight:main"
# `uv run exulanica-corpus`. Writes the synthetic corpus and the ground truth manifest that goes
# with it. Deterministic from its seed, so a rebuild followed by an ingest recomputes nothing.
exulanica-corpus = "exulanica.corpus.__main__:main"
# `uv run exulanica-identity propose --workspace <uuid>`. Asks the corpus what it recognises, from
# context and never from biometrics. Separate from the ingest command because the moment a
# proposal becomes possible is when somebody is NAMED, and no ingest follows that.
exulanica-identity = "exulanica.identity.cli:main"
# `uv run exulanica-db`. Brings a database up to the schema and the roles this code expects, in the
# one correct order. A deployment runs it before the API starts.
exulanica-db = "exulanica.db.cli:main"
# `uv run exulanica-eval run --corpus <dir> --workspace <uuid>`. Measures what can be measured and
# says what stopped the rest. Read docs/evaluation-methodology.md section 3 before quoting it.
exulanica-eval = "exulanica.evaluation.cli:main"
# `uv run exulanica-purge --workspace <uuid>`. Destroys the object-store bytes that committed
# tombstones asked for. Connects as `exulanica_purge` through EXULANICA_PURGE_DATABASE_URL and
# refuses to run without it, because the runtime role cannot see whether another workspace still
# holds the bytes and would destroy them anyway.
exulanica-purge = "exulanica.deletion.cli:main"
# `uv run exulanica-derivative-worker`. The production queue consumer: a separate process with
# renewable leases, signal-aware shutdown and a durable delivery ledger.
exulanica-derivative-worker = "exulanica.ingest.worker_command:main"
# `uv run --extra pose exulanica-scene-worker`. Kept separate from the depth worker because the
# pycolmap and torch wheels load incompatible OpenMP runtimes on macOS.
exulanica-scene-worker = "exulanica.ingest.scene_worker_command:main"
# `uv run exulanica-material-bake --workspace <uuid> --once`. Bakes requested workspace material
# recipes in a Node process of its own, under a timeout and a memory ceiling, and records each
# bake before its bytes are written. Needs Node and the web package installed; downloads nothing.
exulanica-material-bake = "exulanica.world.material_bake_command:main"
# `uv run exulanica-wmp project ...` creates a signed, independently verifiable World Memory
# Package; verify, inspect, and diff never open PostgreSQL.
exulanica-wmp = "exulanica.world_package.cli:main"
# `uv run exulanica-seed export --workspace <uuid> --into <dir>`. Produces the judge seed, restores
# a fresh stack to it, returns a used one to it, and provisions the judge role and token. Read
# docs/judge-access.md; it never prints a bearer token.
exulanica-seed = "exulanica.orchestration.judge_seed_cli:main"
# `uv run exulanica-frontier demonstrate ...` is the Phase 8 source-to-package acceptance path.
# It composes the existing boundaries and requires explicit confirmation for its one durable
# source tombstone.
exulanica-frontier = "exulanica.orchestration.cli:main"

[dependency-groups]
dev = [
  "uvicorn>=0.30",
  # import-linter enforces the layering below. The web workspace has had a dependency-cruiser
  # contract since it was created and the backend had nothing, which meant the layering was a
  # comment. A boundary nobody checks is a boundary that has already been crossed.
  "import-linter>=2.0",
  "pytest>=8.3",
  "ruff>=0.7",
  # One process per worker, each with a private PostgreSQL server: see scripts/test_postgres.py.
  "pytest-xdist>=3.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["exulanica"]

# The reconstruction extra names two packages by git url, because neither is on PyPI in the form
# MoGe needs: MoGe itself is source-only, and `utils3d_moge` is a different package from the
# `utils3d` that is published. Hatchling refuses a direct reference unless it is told to allow
# one, and refusing quietly would have been worse: the alternative is vendoring two repositories.
[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
# The ML stack lags Python 3.14 (the system interpreter here), so the interpreter is pinned
# rather than merely lower-bounded. .python-version holds the concrete pin for `uv run`.
package = true
# uv rebuilds this project's own wheel only when a cache key changes, and its default watches
# pyproject.toml alone. MEASURED 2026-09-05 building the scene worker image: the uv cache mount
# survived from an earlier build, COPY had updated the package, and the image still installed the
# older wheel, so a committed fix was absent from the running worker. The sources are the key.
cache-keys = [{ file = "pyproject.toml" }, { file = "exulanica/**/*.py" }]
# Every package in the lock must have a wheel for both platforms the depth stage runs on, or
# `uv lock` fails here rather than `uv sync` failing on the other machine. Without this uv is
# satisfied by any one wheel per package, which is how a lock carrying a Linux-only torch passed
# `--locked` in CI and in the image and could not be installed on the Mac that runs MoGe.
required-environments = [
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

# Where torch comes from, and why it is spelled out here.
#
# The pinned MoGe commit carries its own `[[tool.uv.index]]` for PyTorch's cu130 wheels and a
# `[tool.uv.sources]` that sends torch and torchvision there, and uv applied both while reading
# MoGe's metadata although nothing in this file named that index. Verified on 2026-09-03 with
# uv 0.12.5: a project whose only dependency is the MoGe git URL locks torch from
# `download.pytorch.org/whl/cu130`. That index publishes Linux and Windows wheels only, and
# MoGe's own `environments = [linux, win32]` is a root-only setting that is NOT inherited, so
# the lock claimed macOS and pinned a torch that does not exist for it. The fix is the one the
# uv PyTorch guide gives (https://docs.astral.sh/uv/guides/integration/pytorch/, retrieved
# 2026-09-02): declare the indexes here, both `explicit` so nothing else is resolved against
# them, and fork the torch source on platform. macOS takes the CPU index, whose arm64 wheel
# runs on Metal through MPS; Linux keeps cu130, which is what a GPU host wants and what the
# previous lock already pinned. torchvision needs no source because the metadata override
# below removes it from the resolution.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
  { index = "pytorch-cu130", marker = "sys_platform == 'linux'" },
]

# What MoGe needs at run time, as the lock sees it. MoGe 3.0.0's metadata lists gradio, trimesh,
# matplotlib, torchvision, a git `pipeline` and a git `flex-gemm` that requires triton, and
# `moge.model.v2`, the one module this package imports, loads none of them: traced through
# `sys.modules` on 2026-09-03, it reaches torch, numpy, cv2, scipy, huggingface_hub and
# utils3d_moge and nothing else outside the standard library. Declaring that here replaces the
# metadata uv would otherwise read from the checkout, so the resolution stops carrying packages
# with no macOS wheel on behalf of code that never runs. Pinned to the version so a bump of the
# MoGe commit that changes its version drops this override rather than silently keeping it, and
# `required-environments` above then reports what the new metadata cannot install.
[[tool.uv.dependency-metadata]]
name = "moge"
version = "3.0.0"
requires-dist = [
  "torch",
  "numpy",
  "opencv-python-headless",
  "scipy",
  "huggingface_hub",
  "utils3d_moge",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["exulanica", "tests", "scripts"]

[tool.ruff.lint]
select = [
  "E", "W",    # pycodestyle
  "F",         # pyflakes
  "I",         # import sorting
  "UP",        # pyupgrade
  "B",         # bugbear
  "SIM",       # simplify
  "RUF",       # ruff-specific
  "ANN",       # missing type annotations: the project rule is type hints everywhere
]
ignore = [
  "ANN401",    # allow typing.Any where a genuinely open value is intended
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]
# Standalone PEP 723 verification harnesses, committed before this package existed and left
# byte-identical so the runtime evidence they produced stays reproducible. Still linted for real
# errors (pyflakes, bugbear); only cosmetic rules are waived.
"scripts/*" = ["ANN", "E501", "E401", "I001"]

[tool.ruff.format]
exclude = ["scripts/*.py"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
  "postgres: requires a live PostgreSQL 18 server with pgvector via EXULANICA_TEST_DATABASE_URL",
  # The endpoint is what these tests check, so they cannot run on a per-worker private server:
  # see scripts/run_backend_suite.py, which runs them serially against the copy in its phase 2.
  "reference_copy: requires the pinned local reference copy, port 5433 and exulanica_inspect_test",
]


# --------------------------------------------------------------------------------------------
# The backend layering, enforced. `uv run lint-imports`.
#
# The rule this encodes: the core is pure and the edges depend on it, never the reverse. The
# evidence address, the object store and the model client know nothing about each other and
# nothing about a database; a change to any one of them cannot reach the other two. Everything
# that talks to PostgreSQL is above them, and the future HTTP layer will sit above that.
# --------------------------------------------------------------------------------------------

[tool.importlinter]
root_package = "exulanica"
# Needed by the forbidden contract below: without it, psycopg is invisible to the graph and the
# contract passes for the wrong reason.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "The backend is layered, and the core is at the bottom"
type = "layers"
# EXHAUSTIVE, and this is the half that makes the layering a rule rather than a habit. A layers
# contract says nothing at all about a package absent from it: an unlisted one may import the
# topmost layer and the contract stays green. That is not hypothetical. `exulanica.graph` was added
# to this list by hand after the package already existed, and until it was, nothing stopped it
# from importing `exulanica.api`. With this set, a new top-level package nobody remembered to place
# breaks the build and names itself.
exhaustive = true
containers = ["exulanica"]
layers = [
  # Phase 8 is the one workflow that intentionally composes every lower product boundary.
  # Nothing imports it; it is an executable acceptance path rather than reusable domain logic.
  "orchestration",
  # Package projection reads every durable plane, but none of those planes may know about an
  # export representation.  Phase 8 orchestration will sit above this boundary.
  "world_package",
  # The evaluation harness is the one module allowed to depend on the HTTP surface, and it is
  # allowed for one reason: M10 specifies its authorisation sweep as "generated from the router",
  # and a harness that cannot see the router hand-enumerates routes, which is the failure that
  # specification exists to prevent. It sits ABOVE the API rather than beside it so the sentence
  # stays true of everything that ships: nothing the product runs depends on the API, and the
  # only thing that does is the thing that measures it.
  "evaluation",
  # The HTTP surface depends on everything and nothing depends on it. That is the definition of
  # a thin API: routes validate and delegate, so a route has nothing another module could want.
  "api",
  # Environment source admission composes scoped persistence, content-addressed storage and the
  # graph's established read-finalization discipline. Query, placement and rendering remain
  # outside it, and none of the lower workflows imports this admission boundary.
  "environment",
  # The three top-level workflows, and none of them may import another: ingesting a photograph,
  # answering a question about one, and reading the whole graph back are separate concerns that
  # happen to share a database, and a dependency in any direction would be the first step to the
  # read path reaching for a writer. `exulanica.graph` is named here rather than left out for the
  # same reason `exulanica.corpus` is named at the bottom: a module absent from every contract is a
  # module the layering says nothing about. It sits one step under the API, which is where an
  # upward import is easiest to write and hardest to notice.
  "graph | selection | ingest",
  # Whether a person may be shown. It sits here, between the three top-level workflows and the
  # identity tables, because both `ingest` (which masks a photograph before anything reads it)
  # and `graph` (which decides what the browser may draw) must resolve the same state, and those
  # two are siblings that may not import each other. It is above `identity` because a person
  # region borrows the occurrence identity key, and below `ingest` so nothing in it can reach a
  # pipeline. Pure: the offline package verifier resolves consent through it with no database.
  "consent",
  "world | identity",
  "epistemics",
  # Erasure sits under everything that writes, because everything that writes may have to ask
  # for it: `exulanica.ingest` writes the tombstone that fills the queue, and there is one
  # `insert_tombstone` rather than one per caller only because this is below it. It is a layer
  # of its own rather than a sibling of `epistemics` so the sentence stays true in both
  # directions: deletion knows nothing about how a claim is written, and a claim writer that
  # reached for the purger would break the build rather than a review.
  "deletion",
  "db | models | store",
  # Traffic simulation reads generated road records and its own catalogs and nothing else. It
  # sits below the database, the store and the model client so the layers refuse those, and the
  # forbidden contract below refuses everything between it and the grammar: it may import
  # grammar, materials, canonical, errors and env. It is placed here rather than directly above
  # grammar only because the grammar tests pin the layers around grammar; the forbidden
  # contract is what carries the rule. The society composition above it passes it data.
  "traffic",
  # Reconstruction is driven by ingest and knows nothing about the evidence spine. It is a
  # layer of its own rather than a sibling of the three above because it must sit BELOW them
  # for the forbidden contract on it to mean anything: a module that may import evidence and
  # chooses not to is a habit, and one that may not is a rule.
  #
  # Capture is its sibling for the same reason the three workflows are siblings of each other.
  # The capture package decides, from the photographs alone and before any GPU spend, whether a
  # set can rebuild; reconstruction then tries. Neither may import the other, so a verdict can
  # never quietly depend on the machinery it is predicting, and a rung can never quietly depend
  # on the prediction. Whatever composes the two sits above both.
  "reconstruction | capture",
  "evidence | migrations",
  # The generator system sits BELOW the evidence spine, one notch stricter than reconstruction:
  # it may import only what is under it, which is material objects, canonical JSON, the error
  # types and the environment reader. A generated world is a pure function of a seed, a set of grammar
  # versions and a catalog, and none of those needs to know what a photograph is. Placing it
  # here is what makes the forbidden contract below a rule rather than a habit.
  "grammar",
  # Materials as data: maker manifests, recipes, library entries, bake receipts, and the checks
  # that decide whether a recipe means something a maker can bake. It sits BELOW the evidence
  # spine, for the reason the forbidden contract on it gives: a recipe is invented, including one
  # a person or a model derives from a photograph, and a module that cannot import an evidence
  # address cannot make a recipe pass for an observation. Everything above may read it.
  #
  # Lettering is its sibling, for the same reason and one more. A glyph catalog is authored data
  # made once from an open-licence font by `tools/lettering`, and the layout rule that places a
  # shop sign's letters is integer arithmetic on it; neither needs to know what a photograph, a
  # database or a generated world is. It sits BELOW `grammar` because the city grammar's validator
  # imports it to check that a sign fits its fascia, and the two are siblings rather than one
  # layer so a recipe can never reach a letter nor a letter a recipe.
  "materials | lettering",
  "canonical",
  # The corpus generator sits at the bottom and depends on nothing in this package at all: it
  # draws pictures with Pillow and knows nothing about evidence, storage or the database. Listed
  # here rather than left out, because a module absent from every contract is a module the
  # layering says nothing about, and the point of the corpus is to be the input to the pipeline
  # rather than a participant in it.
  "corpus | errors",
  "env",
]

[[tool.importlinter.contracts]]
# The model client is the one part of the core that must know nothing about the rest of it.
# Everything it touches is a request and a response; if it ever learns what an evidence address
# is, the temptation to have it write one follows immediately, and invariant 4 is the rule that
# a model never writes into canonical state.
#
# Note what is deliberately NOT claimed here. `exulanica.store` DOES import `exulanica.evidence`,
# because a content-addressed store is keyed by a content address and BlobId is that address.
# The layer list above permits exactly that direction and no other.
name = "The model client knows nothing about evidence, storage or the database"
type = "forbidden"
source_modules = ["exulanica.models"]
forbidden_modules = [
  "exulanica.evidence",
  "exulanica.store",
  "exulanica.db",
  "exulanica.ingest",
  "exulanica.migrations",
]

[[tool.importlinter.contracts]]
# INVARIANT 2, as a rule the tooling keeps rather than a sentence in a document.
#
# "Reconstruction is never evidence. No function may return a rendition, a point map, or a
# rendered view as a citation target." The strongest available form of that is a producer that
# cannot construct a citation: `exulanica.reconstruction` does not import the module that defines an
# evidence address, so no refactor inside it can produce one, and no reviewer has to notice.
#
# The store and the database are forbidden for the same reason one step further out. A module that
# could write to the object store could register a point map as a blob, and a blob is the one
# thing an `evidence_span` is allowed to point at. The pipeline does the writing, where the rule
# about what may be cited is already enforced by the schema.
name = "Reconstruction cannot produce a citation, because it cannot name one"
type = "forbidden"
source_modules = ["exulanica.reconstruction"]
forbidden_modules = [
  "exulanica.evidence",
  "exulanica.store",
  "exulanica.db",
  "exulanica.ingest",
  "exulanica.identity",
  "exulanica.selection",
]

[[tool.importlinter.contracts]]
# ADR-0008, as a rule the tooling keeps rather than a sentence in a document.
#
# A generated subject, whether a street, a tree, a chair or a person, is a pure function of a
# seed, a grammar version and a catalog. It is never evidence and must never be able to pass for
# it. The strongest available form of that is a generator that cannot construct a citation:
# `exulanica.grammar` does not import the module that defines an evidence address, cannot write
# a blob a span could point at, cannot open the database, cannot reach the pipeline that admits a
# photograph, cannot name a person, and cannot reach the selector that binds cited content for a
# model. No refactor inside it can produce any of those, and no reviewer has to notice.
#
# Note what is deliberately NOT claimed here. Every module named below already sits above
