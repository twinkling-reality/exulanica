# open the database, the store or the evidence spine would be a second writer nobody reviewed.
#
# Note what is deliberately NOT claimed here. `reconstruction` is not listed because it is this
# package's sibling in the layer list, and siblings already may not import each other. `grammar`
# is listed even though it sits below: a reconstructability verdict is about recorded photographs
# and has no business reading a generated world. The external names are only checkable while
# something in this package graph imports them; if the last importer of one goes, this contract
# errors on a missing module and the name should be removed here rather than the check weakened.
