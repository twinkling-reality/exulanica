[project]
name = "exulanica-training"
version = "0.1.0"
description = "Training code for Exulanica's learned material models, in its own environment and its own container."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.13"
# Deliberately not installed into the product's environment, and not locked yet: resolving and
# installing torch is a download, and it waits for an operator's yes (README.md). The container
# recipe under container/ takes torch and numpy from a digest-pinned base image instead.
dependencies = [
  "numpy>=2.1,<3",
  "torch>=2.5",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["exulanica_training"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers --strict-config"

[tool.ruff]
line-length = 100
target-version = "py311"
