[project]
name = "exulanica-appearance"
version = "0.1.0"
description = "Generated appearance on exact structure: structure capture, generation records and evaluation, outside the product."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.13"
# The base environment captures structure, reads and writes the records and measures pictures. It
# runs on the operator's Mac and needs no GPU.
dependencies = [
  "numpy>=2.1,<3",
  "pillow>=11,<12",
]

[project.optional-dependencies]
# Installed only inside the GPU container on a rented machine, never on the operator's Mac.
gpu = [
  # The models and their loaders.
  "torch>=2.8,<3",
  "torchvision>=0.23,<1",
  "diffusers>=0.37,<0.38",
  "transformers>=4.57,<5",
  "accelerate>=1.10,<2",
  "safetensors>=0.6,<1",
  # What VideoX-Fun (installed at a pinned commit by the container) imports when its model and
  # pipeline packages load; measured over its source at that commit. func_timeout (LGPL-3.0), which
  # only its dataset loaders use, is left out and stood in for (runner/backends/videox.py).
  "einops>=0.8,<1",
  "ftfy>=6,<7",
  "imageio>=2.34,<3",
  "librosa>=0.10,<1",
  "opencv-python-headless>=4.10,<5",
  "packaging>=24",
  "requests>=2.32,<3",
  "scipy>=1.13,<2",
  "sentencepiece>=0.2,<1",
  "tqdm>=4.66,<5",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["exulanica_appearance"]

[tool.uv]
package = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers --strict-config"

[tool.ruff]
line-length = 100
target-version = "py311"
