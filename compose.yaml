# A local composition, target agnostic on purpose. Nothing here names a cloud, a region, a domain
# or an account: every such value is an environment variable with a stated fill-in, because the
# deployment target is a human decision that has not been made.
#
# `docs/deployment.md` is the document this file implements. Read it before changing anything
# here, in particular section 6 on the health signals and section 4 on the content store's
# append-only wording.

name: exulanica

# One backend build for every backend service. EXULANICA_BACKEND_EXTRAS selects the image's extras:
# "--extra server" by default, for the default profile single-host-server-only, which runs no
# reconstruction worker; "--extra server --extra pose" (linux/amd64) for single-host.
x-backend-build: &backend-build
  context: .
  args:
    EXULANICA_SYNC_EXTRAS: ${EXULANICA_BACKEND_EXTRAS:---extra server}

# Society playback (docs/deployment.md 5.1.5): which workspaces' societies play, account-wide
# discovery and the base wait. The API and the playback worker take them from here alike, because
# the API reads the worker's liveness by the digest of exactly these settings.
x-society-playback: &society-playback
  EXULANICA_SOCIETY_CONTROL_WORKSPACES: ${EXULANICA_SOCIETY_CONTROL_WORKSPACES:-}
  # Account-wide playback is a separate opt-in from configuring browser accounts.
  EXULANICA_SOCIETY_CONTROL_WORKER: ${EXULANICA_SOCIETY_CONTROL_WORKER:-off}
  EXULANICA_SOCIETY_TICK_INTERVAL_MS: ${EXULANICA_SOCIETY_TICK_INTERVAL_MS:-}

services:
  postgres:
    # Restarted when its process exits. Docker does not restart a container whose health check
    # fails; it only marks it unhealthy (docs/deployment.md section 9).
    restart: unless-stopped
    # The documented target, matched exactly: PostgreSQL 18 with pgvector 0.8.6, which is what
    # `tests/pg_harness.py` refuses to run without. A different tag here means the suite is
    # verifying a schema the deployment does not run.
    image: pgvector/pgvector:0.8.6-pg18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-exulanica}
      POSTGRES_USER: ${POSTGRES_USER:-exulanica}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD; there is no default}
    volumes:
      # PostgreSQL 18 moved PGDATA and the image's VOLUME with it. Mounting the old
      # /var/lib/postgresql/data would give a volume the server does not write to, and the
      # symptom is a database that is empty after every restart.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-exulanica} -d ${POSTGRES_DB:-exulanica}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Runs once, to completion, before the API starts. Migrations and role grants are one command
  # because there is one correct order; see exulanica/db/cli.py.
  migrate:
    build: *backend-build
    command: ["exulanica-db"]
    environment:
      EXULANICA_DATABASE_URL: postgresql://${POSTGRES_USER:-exulanica}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-exulanica}
      EXULANICA_APP_ROLE_PASSWORD: ${EXULANICA_APP_ROLE_PASSWORD:?set EXULANICA_APP_ROLE_PASSWORD; the runtime must not use the owner}
      EXULANICA_EXECUTOR_ROLE_PASSWORD: ${EXULANICA_EXECUTOR_ROLE_PASSWORD:?set EXULANICA_EXECUTOR_ROLE_PASSWORD; the executor has its own read-only role}
      EXULANICA_ACCOUNT_ROLE_PASSWORD: ${EXULANICA_ACCOUNT_ROLE_PASSWORD:-}
      # The tile role publishes a baked tile and does nothing else (migration 0138); only the
      # tile-worker service below connects as it.
      EXULANICA_TILES_ROLE_PASSWORD: ${EXULANICA_TILES_ROLE_PASSWORD:-}
      # The purge role destroys stored bytes and the backup role reads every row for a backup;
      # only the maintenance service below connects as either (docs/deployment.md 9.2, 9.3).
      EXULANICA_PURGE_ROLE_PASSWORD: ${EXULANICA_PURGE_ROLE_PASSWORD:?set EXULANICA_PURGE_ROLE_PASSWORD; maintenance purges as its own role}
      EXULANICA_BACKUP_ROLE_PASSWORD: ${EXULANICA_BACKUP_ROLE_PASSWORD:?set EXULANICA_BACKUP_ROLE_PASSWORD; maintenance backs up as its own read-only role}
    depends_on:
      postgres:
        condition: service_healthy
      restore-marker:
        condition: service_completed_successfully

  # Runs to completion after `migrate`, before the API: publishes the character catalogs the image
  # carries (migration 0131), the people every world draws and the parametric family a person may
  # wear. Publication is host administration, so it connects as the owner, as `migrate` does, and
  # writes into the store the API serves. It runs on every `up`, a restored installation's included:
  # an identical catalog is answered `unchanged`, and a newer image serves its newer revision.
  # Without it nobody is drawn and /readyz says so.
  catalogs:
    build: *backend-build
    command: ["exulanica-character-catalog", "publish", "--apply"]
    environment:
      EXULANICA_DATABASE_URL: postgresql://${POSTGRES_USER:-exulanica}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-exulanica}
      EXULANICA_DATA_DIR: /var/lib/exulanica
    volumes:
      - media:/var/lib/exulanica
    depends_on:
      # Its own wait for the database, so a start that names it with --no-deps cannot race it.
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  api:
    # The image's command, with a bounded shutdown: without it a stop waits for every open
    # progress stream, which ends only at its thirty-minute cap.
    command: ["uvicorn", "--factory", "exulanica.api.app:create_app", "--host", "0.0.0.0", "--port", "8000", "--timeout-graceful-shutdown", "10"]
    # Restarted when its process exits. Docker does not restart a container whose health check
    # fails; it only marks it unhealthy (docs/deployment.md section 9).
    restart: unless-stopped
    build: *backend-build
    environment:
      # Runtime processes never receive the bootstrap owner credential. PostgreSQL superusers
      # bypass row-level security even on FORCE tables, so this role choice is a data boundary.
      EXULANICA_DATABASE_URL: postgresql://exulanica_app:${EXULANICA_APP_ROLE_PASSWORD}@postgres:5432/${POSTGRES_DB:-exulanica}
      EXULANICA_READONLY_DATABASE_URL: postgresql://exulanica_ro:${EXULANICA_EXECUTOR_ROLE_PASSWORD}@postgres:5432/${POSTGRES_DB:-exulanica}
      # No default. `load_token_directory` raises when it is unset, and an API that started with
      # an empty token directory would accept nobody while looking healthy. Every grant names its
      # `permissions`; one that does not also stops startup.
      EXULANICA_API_TOKENS: ${EXULANICA_API_TOKENS:?set EXULANICA_API_TOKENS; there is no default}
      EXULANICA_GOOGLE_CLIENT_ID: ${EXULANICA_GOOGLE_CLIENT_ID:-}
      EXULANICA_GOOGLE_CLIENT_SECRET: ${EXULANICA_GOOGLE_CLIENT_SECRET:-}
      EXULANICA_GOOGLE_CALLBACK_URI: ${EXULANICA_GOOGLE_CALLBACK_URI:-}
      EXULANICA_GOOGLE_RETURN_URIS: ${EXULANICA_GOOGLE_RETURN_URIS:-}
      EXULANICA_ACCOUNT_BROWSER_ORIGINS: ${EXULANICA_ACCOUNT_BROWSER_ORIGINS:-}
      EXULANICA_ACCOUNT_DATABASE_URL: ${EXULANICA_ACCOUNT_DATABASE_URL:-}
      # The guest entry (docs/deployment.md 5.1.4): off unless stated; its figures are the
      # operator's, with no default for the day's limit.
      EXULANICA_GUEST_ENTRY: ${EXULANICA_GUEST_ENTRY:-}
      EXULANICA_GUEST_ENTRY_CODE_SHA256: ${EXULANICA_GUEST_ENTRY_CODE_SHA256:-}
      EXULANICA_GUEST_ENTRIES_PER_DAY: ${EXULANICA_GUEST_ENTRIES_PER_DAY:-}
      EXULANICA_GUEST_SESSION_SECONDS: ${EXULANICA_GUEST_SESSION_SECONDS:-}
      # How long after a guest's last request their town plays, and how many play at once
      # (docs/deployment.md 5.1.5); empty takes the defaults. Guests' towns play in this process.
      EXULANICA_GUEST_PLAY_SECONDS: ${EXULANICA_GUEST_PLAY_SECONDS:-}
      EXULANICA_GUEST_PLAYING_MAXIMUM: ${EXULANICA_GUEST_PLAYING_MAXIMUM:-}
      <<: *society-playback
      # Who plays: "on" (the default), this process in threads; "process", the playback-worker
      # service below, started with `--profile playback`, and this process plays nothing.
      EXULANICA_PLAYBACK_WORKER: ${EXULANICA_PLAYBACK_WORKER:-on}
      EXULANICA_DATA_DIR: /var/lib/exulanica
      # Production delivery belongs to the separate worker service below. The in-process worker
      # remains available for a one-process development run, but this composition does not use it.
      EXULANICA_DERIVATIVE_WORKER: "off"
      NEBIUS_API_KEY: ${NEBIUS_API_KEY:-}
      # No default. Read when a model client is built (NEBIUS_API_KEY set) and when Google sign-in
      # is configured: an unset or malformed allowlist, or one that omits the model endpoint or
      # the three Google sign-in origins, stops startup. See docs/security-floor.md.
      EXULANICA_EGRESS_ALLOWLIST: ${EXULANICA_EGRESS_ALLOWLIST:-}
      # How the process spends on hosted models, durable or process: required whenever
      # NEBIUS_API_KEY is set, with no default (docs/model-spending-contract.md). Every spending
      # process shares the witness volume, which is never restored with the database.
      EXULANICA_SPENDING: ${EXULANICA_SPENDING:-}
      EXULANICA_SPENDING_WITNESS_DIR: /var/lib/exulanica-spending-witness
      # The installation this API belongs to and what it reports about itself (docs/deployment.md
      # 9.1). The revision and image digests are the ones deployed; unset, facts say so.
      EXULANICA_INSTALLATION_PROFILE: /app/deploy/profiles/${EXULANICA_PROFILE:-single-host-server-only}.json
      EXULANICA_MAINTENANCE_STATUS_PATH: /var/lib/exulanica-status/maintenance.json
      EXULANICA_CODE_REVISION: ${EXULANICA_CODE_REVISION:-}
      EXULANICA_IMAGE_BACKEND: ${EXULANICA_IMAGE_BACKEND:-}
      EXULANICA_IMAGE_CLIENT: ${EXULANICA_IMAGE_CLIENT:-}
    volumes:
      - media:/var/lib/exulanica
      - spending-witness:/var/lib/exulanica-spending-witness
      - maintenance-status:/var/lib/exulanica-status:ro
      # The restore marker the profile names (ADR-0019): read here, written by restore-marker and
      # by an operator's declared restore, never by the API.
      - restore-control:/var/lib/exulanica-restore:ro
    ports:
      - "${EXULANICA_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      catalogs:
        condition: service_completed_successfully
      restore-marker:
        condition: service_completed_successfully

  # The reconstruction workers start only with `--profile reconstruction`, on a linux/amd64 host
  # whose image carries the reconstruction and pose extras (installation profile single-host). The
  # default composition is single-host-server-only, whose profile reports them unavailable.
  derivative-worker:
    profiles: ["reconstruction"]
    build:
      context: .
      args:
        EXULANICA_SYNC_EXTRAS: "--extra reconstruction"
    command: ["exulanica-derivative-worker"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 30s
      timeout: 3s
      retries: 3
    environment:
      EXULANICA_DATABASE_URL: postgresql://exulanica_app:${EXULANICA_APP_ROLE_PASSWORD}@postgres:5432/${POSTGRES_DB:-exulanica}
      # Static compatibility scope may be empty when the verified account-role source is set.
      # The command refuses startup when both sources are absent.
      EXULANICA_WORKSPACE_IDS: ${EXULANICA_WORKSPACE_IDS:-}
      EXULANICA_ACCOUNT_DATABASE_URL: ${EXULANICA_ACCOUNT_DATABASE_URL:-}
      # Who counts as there, drained each pass: the API's play window (empty: 900 s).
      EXULANICA_GUEST_PLAY_SECONDS: ${EXULANICA_GUEST_PLAY_SECONDS:-}
      EXULANICA_DATA_DIR: /var/lib/exulanica
      # The checkpoint is the one models.manifest.json pins as local_roles.depth.
      EXULANICA_DEPTH_MODEL: moge
      EXULANICA_DEPTH_DEVICE: ${EXULANICA_DEPTH_DEVICE:-}
      HF_HOME: /var/lib/exulanica/model-cache
      NEBIUS_API_KEY: ${NEBIUS_API_KEY:-}
      # No default. Read only when a model client is built, which is when NEBIUS_API_KEY is set:
      # then an unset or malformed allowlist, or one that omits the model endpoint, stops startup.
      # See docs/security-floor.md.
      EXULANICA_EGRESS_ALLOWLIST: ${EXULANICA_EGRESS_ALLOWLIST:-}
      # As the API: required with NEBIUS_API_KEY, and the same witness volume.
      EXULANICA_SPENDING: ${EXULANICA_SPENDING:-}
      EXULANICA_SPENDING_WITNESS_DIR: /var/lib/exulanica-spending-witness
    volumes:
      - media:/var/lib/exulanica
      - spending-witness:/var/lib/exulanica-spending-witness
    depends_on:
      migrate:
        condition: service_completed_successfully

  scene-worker:
    profiles: ["reconstruction"]
    build: *backend-build
    command: ["exulanica-scene-worker"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 30s
      timeout: 3s
      retries: 3
    environment:
      EXULANICA_DATABASE_URL: postgresql://exulanica_app:${EXULANICA_APP_ROLE_PASSWORD}@postgres:5432/${POSTGRES_DB:-exulanica}
      EXULANICA_WORKSPACE_IDS: ${EXULANICA_WORKSPACE_IDS:?set EXULANICA_WORKSPACE_IDS to the comma-separated workspaces this worker may drain}
      EXULANICA_DATA_DIR: /var/lib/exulanica
      # Both values enter the signed-by-content pose manifest. No mutable image tag or guessed
      # checkout is accepted as provenance for geometry that reaches the renderer. Compose checks
      # a required value for every service, started or not, so the worker itself refuses to start
      # without either (exulanica/ingest/scene_worker_command.py) rather than a server-only
      # installation having to invent a pose image it never runs.
      EXULANICA_CODE_REVISION: ${EXULANICA_CODE_REVISION:-}
      EXULANICA_POSE_RUNTIME_IMAGE: ${EXULANICA_POSE_RUNTIME_IMAGE:-}
    volumes:
      - media:/var/lib/exulanica
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Workspace asset preparation (docs/deployment.md 9.1): the preparers the installation's profile
  # installs and nothing else, from the same backend image. The static GLB preparer is pure Python;
  # the character body preparer needs a pinned Blender no image carries, so every shipped profile
  # declares it not installed, and the worker refuses to start if a preparer the profile installs
  # cannot run here.
  preparation:
    build: *backend-build
    command: ["exulanica-asset-preparation"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 30s
      timeout: 3s
      retries: 3
    environment:
      EXULANICA_DATABASE_URL: postgresql://exulanica_app:${EXULANICA_APP_ROLE_PASSWORD}@postgres:5432/${POSTGRES_DB:-exulanica}
      # As the derivative worker: static workspaces, the verified account-role source, or both;
      # the command refuses startup when both are absent.
      EXULANICA_WORKSPACE_IDS: ${EXULANICA_WORKSPACE_IDS:-}
      EXULANICA_ACCOUNT_DATABASE_URL: ${EXULANICA_ACCOUNT_DATABASE_URL:-}
      # Who counts as there, drained each pass: the API's play window (empty: 900 s).
      EXULANICA_GUEST_PLAY_SECONDS: ${EXULANICA_GUEST_PLAY_SECONDS:-}
      EXULANICA_DATA_DIR: /var/lib/exulanica
      EXULANICA_INSTALLATION_PROFILE: /app/deploy/profiles/${EXULANICA_PROFILE:-single-host-server-only}.json
    volumes:
      - media:/var/lib/exulanica
    depends_on:
      migrate:
        condition: service_completed_successfully

  # The generated-tile worker (docs/deployment.md 9.1): bakes the tiles generated towns wait for,
  # off the request, with the tessellator compiled to JavaScript and run by Node
  # (deploy/installation/tiles.Dockerfile), and publishes each bake as the tile role, which may do
  # nothing else (migration 0138). Started only with `--profile tiles`, by an installation whose
  # profile installs generated_tiles (`public`); every other shipped profile declares it not
  # installed, and creation reads unavailable there.
  tile-worker:
    profiles: ["tiles"]
    build:
      context: .
      dockerfile: deploy/installation/tiles.Dockerfile
      additional_contexts:
        backend: service:api
    command: ["exulanica-generated-tile-worker"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 30s
      timeout: 3s
      retries: 3
    environment:
      EXULANICA_DATABASE_URL: postgresql://exulanica_app:${EXULANICA_APP_ROLE_PASSWORD}@postgres:5432/${POSTGRES_DB:-exulanica}
      EXULANICA_TILE_PUBLISHER_DATABASE_URL: postgresql://exulanica_tiles:${EXULANICA_TILES_ROLE_PASSWORD:-}@postgres:5432/${POSTGRES_DB:-exulanica}
      # As the derivative worker: static workspaces, the verified account-role source, or both.
      EXULANICA_WORKSPACE_IDS: ${EXULANICA_WORKSPACE_IDS:-}
      EXULANICA_ACCOUNT_DATABASE_URL: ${EXULANICA_ACCOUNT_DATABASE_URL:-}
      # Who counts as there, drained each pass: the API's play window (empty: 900 s).
      EXULANICA_GUEST_PLAY_SECONDS: ${EXULANICA_GUEST_PLAY_SECONDS:-}
      EXULANICA_DATA_DIR: /var/lib/exulanica
      EXULANICA_INSTALLATION_PROFILE: /app/deploy/profiles/${EXULANICA_PROFILE:-single-host-server-only}.json
    volumes:
      - media:/var/lib/exulanica
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Society playback in a process of its own (docs/deployment.md 5.1.5), beside an API started with
  # EXULANICA_PLAYBACK_WORKER=process. Started only with `--profile playback`: it refuses to start
  # when the playback settings name no society to play, and a default composition names none. A
  # round it is running finishes or rolls back on SIGTERM, inside its 30 second lease, so the stop
  # grace outlasts the lease.
  playback-worker:
    profiles: ["playback"]
    build: *backend-build
    command: ["exulanica-playback-worker"]
    restart: unless-stopped
    stop_grace_period: 40s
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 30s
      timeout: 3s
      retries: 3
    environment:
      EXULANICA_DATABASE_URL: postgresql://exulanica_app:${EXULANICA_APP_ROLE_PASSWORD}@postgres:5432/${POSTGRES_DB:-exulanica}
      EXULANICA_READONLY_DATABASE_URL: postgresql://exulanica_ro:${EXULANICA_EXECUTOR_ROLE_PASSWORD}@postgres:5432/${POSTGRES_DB:-exulanica}
      # The same tokens and account source the API reads; it serves nothing over HTTP.
      EXULANICA_API_TOKENS: ${EXULANICA_API_TOKENS:?set EXULANICA_API_TOKENS; there is no default}
      EXULANICA_ACCOUNT_DATABASE_URL: ${EXULANICA_ACCOUNT_DATABASE_URL:-}
      <<: *society-playback
      EXULANICA_PLAYBACK_WORKER: process
      EXULANICA_DATA_DIR: /var/lib/exulanica
      # A minute of a society may ask the models its owner chose, under the API's spending rules.
      NEBIUS_API_KEY: ${NEBIUS_API_KEY:-}
      EXULANICA_EGRESS_ALLOWLIST: ${EXULANICA_EGRESS_ALLOWLIST:-}
      EXULANICA_SPENDING: ${EXULANICA_SPENDING:-}
      EXULANICA_SPENDING_WITNESS_DIR: /var/lib/exulanica-spending-witness
      EXULANICA_INSTALLATION_PROFILE: /app/deploy/profiles/${EXULANICA_PROFILE:-single-host-server-only}.json
    volumes:
      - media:/var/lib/exulanica
      - spending-witness:/var/lib/exulanica-spending-witness
      # It refuses to play a restored database whose withdrawals are not replayed, as the API does.
      - restore-control:/var/lib/exulanica-restore:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      catalogs:
        condition: service_completed_successfully
      restore-marker:
        condition: service_completed_successfully

  # Unattended maintenance: withdrawal exports on change, purges, backup sets, their purge and
  # verification, retention and queue ages, one bounded pass at a time (docs/deployment.md 9.3).
  # Backups and custody are bind mounts the operator names, because they belong on storage apart
  # from pgdata and media; custody must not be inside the backup directory.
  maintenance:
    build:
      context: .
      dockerfile: deploy/installation/maintenance.Dockerfile
      # The API's backend image, with the PostgreSQL programs a backup needs added.
      additional_contexts:
        backend: service:api
    command: ["exulanica-installation", "maintenance", "--loop"]
    restart: unless-stopped
    environment:
      EXULANICA_BACKUP_DATABASE_URL: postgresql://exulanica_backup:${EXULANICA_BACKUP_ROLE_PASSWORD}@postgres:5432/${POSTGRES_DB:-exulanica}
      EXULANICA_PURGE_DATABASE_URL: postgresql://exulanica_purge:${EXULANICA_PURGE_ROLE_PASSWORD}@postgres:5432/${POSTGRES_DB:-exulanica}
      EXULANICA_INSTALLATION_PROFILE: /app/deploy/profiles/${EXULANICA_PROFILE:-single-host-server-only}.json
      EXULANICA_DATA_DIR: /var/lib/exulanica
      EXULANICA_BACKUP_DIRECTORY: /var/lib/exulanica-backup/sets
      EXULANICA_BACKUP_STORE_DIRECTORY: /var/lib/exulanica-backup/store
      EXULANICA_CUSTODY_DIRECTORY: /var/lib/exulanica-custody
      EXULANICA_MAINTENANCE_STATUS_PATH: /var/lib/exulanica-status/maintenance.json
    volumes:
      - media:/var/lib/exulanica
      - maintenance-status:/var/lib/exulanica-status
      - restore-control:/var/lib/exulanica-restore:ro
      # Read only: maintenance copies witness records out as evidence and never writes them.
      - spending-witness:/var/lib/exulanica-spending-witness:ro
      - ${EXULANICA_BACKUP_PATH:?set EXULANICA_BACKUP_PATH to a directory apart from the database and media storage}:/var/lib/exulanica-backup
      - ${EXULANICA_CUSTODY_PATH:?set EXULANICA_CUSTODY_PATH to a directory apart from the backup directory}:/var/lib/exulanica-custody
    depends_on:
      migrate:
        condition: service_completed_successfully
      restore-marker:
        condition: service_completed_successfully

  # Runs once, before migrate: on a first install (an empty database) writes the profile's
  # restore marker in state none. On an installed database a missing marker is lost custody: it
  # refuses, and the API, which needs it, does not start.
  restore-marker:
    build: *backend-build
    command: ["exulanica-installation", "init"]
    environment:
      EXULANICA_RESTORE_DATABASE_URL: postgresql://${POSTGRES_USER:-exulanica}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-exulanica}
      EXULANICA_INSTALLATION_PROFILE: /app/deploy/profiles/${EXULANICA_PROFILE:-single-host-server-only}.json
    volumes:
      - restore-control:/var/lib/exulanica-restore
    depends_on:
      postgres:
        condition: service_healthy

  # An operator's restore, run by hand, never on its own (docs/deployment.md 9.4):
  # `docker compose --profile recovery run --rm restore declared --backup-set DIR --export FILE
  # --declaration FILE --marker /var/lib/exulanica-restore/restore.json` into an empty server, or
  # `... restore planned --backup-set DIR --checkpoint FILE --marker ... --set-aside` with every
  # other service stopped.
  # Like migrate, it is a one-shot job and the only kind that holds the owner connection.
  restore:
    profiles: ["recovery"]
    build:
      context: .
      dockerfile: deploy/installation/maintenance.Dockerfile
      additional_contexts:
        backend: service:api
    entrypoint: ["exulanica-installation", "restore"]
    environment:
      EXULANICA_RESTORE_MAINTENANCE_URL: postgresql://${POSTGRES_USER:-exulanica}:${POSTGRES_PASSWORD}@postgres:5432/postgres
      EXULANICA_RESTORE_DATABASE_URL: postgresql://${POSTGRES_USER:-exulanica}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-exulanica}
      # A planned restore's source: on one host, the same database, sealed then set aside.
      EXULANICA_SOURCE_DATABASE_URL: postgresql://${POSTGRES_USER:-exulanica}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-exulanica}
      EXULANICA_PURGE_DATABASE_URL: postgresql://exulanica_purge:${EXULANICA_PURGE_ROLE_PASSWORD}@postgres:5432/${POSTGRES_DB:-exulanica}
      EXULANICA_APP_ROLE_PASSWORD: ${EXULANICA_APP_ROLE_PASSWORD}
      EXULANICA_EXECUTOR_ROLE_PASSWORD: ${EXULANICA_EXECUTOR_ROLE_PASSWORD}
      EXULANICA_PURGE_ROLE_PASSWORD: ${EXULANICA_PURGE_ROLE_PASSWORD}
      EXULANICA_BACKUP_ROLE_PASSWORD: ${EXULANICA_BACKUP_ROLE_PASSWORD}
      EXULANICA_ACCOUNT_ROLE_PASSWORD: ${EXULANICA_ACCOUNT_ROLE_PASSWORD:-}
      EXULANICA_INSTALLATION_PROFILE: /app/deploy/profiles/${EXULANICA_PROFILE:-single-host-server-only}.json
      EXULANICA_DATA_DIR: /var/lib/exulanica
      EXULANICA_BACKUP_STORE_DIRECTORY: /var/lib/exulanica-backup/store
      # A declared recovery replays the newest export in custody, whatever file is named.
      EXULANICA_CUSTODY_DIRECTORY: /var/lib/exulanica-custody
    volumes:
      - media:/var/lib/exulanica
      - restore-control:/var/lib/exulanica-restore
      - ${EXULANICA_BACKUP_PATH:?set EXULANICA_BACKUP_PATH to a directory apart from the database and media storage}:/var/lib/exulanica-backup
      - ${EXULANICA_CUSTODY_PATH:?set EXULANICA_CUSTODY_PATH to a directory apart from the backup directory}:/var/lib/exulanica-custody
    depends_on:
      postgres:
        condition: service_healthy

  # The browser client: the app's production bundle, built on the host, served by nginx, which
  # proxies /api to the API (deploy/installation/client.Dockerfile). Bound to loopback, as the
  # reviewer stack's is: a public address needs TLS in front of it.
  client:
    # Restarted when its process exits. Docker does not restart a container whose health check
    # fails; it only marks it unhealthy (docs/deployment.md section 9).
    restart: unless-stopped
    build:
      context: .
      dockerfile: deploy/installation/client.Dockerfile
      args:
        EXULANICA_CODE_REVISION: ${EXULANICA_CODE_REVISION:-}
        EXULANICA_CLIENT_TREE_SHA256: ${EXULANICA_CLIENT_TREE_SHA256:-}
        EXULANICA_NODE_VERSION: ${EXULANICA_NODE_VERSION:-}
        EXULANICA_PNPM_VERSION: ${EXULANICA_PNPM_VERSION:-}
    ports:
      - "127.0.0.1:${EXULANICA_CLIENT_PORT:-8080}:8080"
    depends_on:
      - api

volumes:
  pgdata:
  # What maintenance last did, read by the API's installation facts.
  maintenance-status:
  # The external restore marker, outside both the database and the media backups.
  restore-control:
  # The spending witness: what every authority's ledger has committed, kept apart from pgdata so a
  # database restore cannot hand spent allowance back. Never back it up as restorable data.
  spending-witness:
  # The content-addressed store. Append-only by policy: nothing in the runtime deletes from it,
  # and erasure runs through a separately authorised purger. Not immutable, not WORM, not
  # tamper-proof: a docker volume supports none of those and claiming them would be an overclaim.
  media:
