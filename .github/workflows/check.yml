name: check

# The verification battery, run the way a machine must run it. The one difference from a local
# run is EXULANICA_REQUIRE_POSTGRES, which turns "skipped, no server" into a failure: locally a
# machine with no database is a normal state, and in CI it is a suite that proved nothing.
on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded pull request runs, never a push to main: a cancelled main run leaves no
  # record of whether that commit was ever green.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        # The documented target, matched exactly. tests/pg_harness.py refuses a server that
        # cannot run the schema rather than substituting for it, which is how R11 was found.
        image: pgvector/pgvector:0.8.6-pg18
        env:
          POSTGRES_PASSWORD: postgres
          # The suite logs in as the non-superuser roles it provisions, by name and with no
          # password of their own, exactly as it does on the private servers
          # scripts/test_postgres.py starts with initdb --auth=trust. Under the image's default
          # password authentication every such login is refused. This server holds nothing but
          # the suite's throwaway schemas and is reachable only from this job.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          # The visual gate tests resolve the commits their evaluation records were measured
          # at, so a shallow clone fails them for a reason that is not about the code.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.11
      # tests/test_restore_replay.py dumps and restores with PostgreSQL 18's pg_dump and psql,
      # found in /usr/lib/postgresql/18/bin. The runner image carries an older client, and an
      # older pg_dump refuses a newer server rather than dumping it.
      - name: install the PostgreSQL 18 client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install --yes postgresql-client-18
      # A superuser connection, because the harness creates and drops throwaway schemas and
      # installs extensions. tests/test_row_level_security.py provisions its own non-superuser
      # roles and asserts they are not superusers before it asserts anything else.
      - name: create the test database
        run: psql "$ADMIN_URL" -c 'create database exulanica_spine_test'
        env:
          ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
          PGPASSWORD: postgres
      - run: uv run ruff check .
      - run: uv run lint-imports
      # Phase 1 of scripts/run_backend_suite.py: every test except those marked reference_copy.
      # Those check the frontier preflight's pinned endpoint, the retained reference copy on
      # port 5433, which exists only on the machine that holds the retained data; the runner's
      # phase 2 runs them there. tests/test_ci_workflow.py fails when this selection stops being
      # the runner's phase 1, in either direction.
      - name: pytest
        run: uv run pytest -m "not reference_copy" --junitxml="$RUNNER_TEMP/backend-suite.xml"
        env:
          EXULANICA_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/exulanica_spine_test
          # The whole reason this job exists. Without it a broken server silently skips the 19
          # tests that are the only executable proof of invariant 4.
          EXULANICA_REQUIRE_POSTGRES: "1"
      # Every skip the run reported, held to tests/expected_skips.toml by the backend runner's own
      # check, which fails on a skip nothing there accepts. The junit file is written outside the
      # checkout so the check's header reads the tree as the commit left it. tests/test_ci_workflow.py
      # fails when this step stops checking that file or could let the job pass without checking it.
      - name: skips
        run: uv run python scripts/run_backend_suite.py --check-skips "$RUNNER_TEMP/backend-suite.xml"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          # The workspace's packageManager field names the pnpm version. The action reads
          # ./package.json unless told otherwise, and the repository root has none.
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # typecheck, the dependency-cruiser contract over 11 packages, and vitest.
      - run: pnpm check

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Built and not pushed. There is no registry because there is no deployment target, and
      # naming one here would be deciding something that belongs to a human. What this proves is
      # that the image builds, which is the half that can rot without anybody noticing.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
