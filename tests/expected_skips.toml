# What continuous integration's machine lacks and every machine running the backend runner has.
# The check workflow installs PostgreSQL 18's client and no server, so the tests that start
# servers of their own skip there; under the runner they fail instead. The union-attr gate
# measures with the mypy its baseline names, read from the uv cache, and uv.lock names no mypy,
# so no workflow run caches one; on any other machine that skip is the loss of the checker, which
# tests/test_type_gate.py says must fail loudly.
[[cause]]
reason = "no PostgreSQL 18 server binaries were found, and these tests start servers of their own"
only_in_ci = true

[[cause]]
reason = "the union-attr gate cannot run on this machine: it holds no runnable mypy of the version the baseline names"
only_in_ci = true

