# Every skip the backend suite runner accepts, with the reason pytest reports for it.
#
# scripts/run_backend_suite.py reads this before it starts, prints every skip a phase reports
# with its reason, and fails a run that skipped a test nothing here accepts. Continuous
# integration runs pytest itself and hands the junit file it wrote to the same check
# (`run_backend_suite.py --check-skips`). A skip is a test that did not run, and a skip nobody
# decided on has hidden real failures behind a green run, so adding one is a line in this file
# that a reviewer reads, not something a run absorbs.
#
# Two kinds of entry, and a skip is accepted by either:
#
# [[skip]] names one test. `test` is the pytest node id and `reason` the skip message exactly as
# pytest reports it. `only_without`, when given, names a path relative to the repository root
# whose absence is the reason; in a tree that holds the path the skip is not accepted, because
# there the test has what it needs. tests/test_backend_suite.py checks that every entry names a
# test pytest collects.
#
# [[cause]] names one reason, from whatever test reports it, and the absence it states:
# `only_without`, a path as above, or `only_without_extra`, extras of pyproject.toml, one or a
# list. The reason is accepted only where that absence is so: in a tree holding the path, or an
# environment with every named extra installed, the same skip is refused. An absence of the
# machine rather than the tree, which every machine running the backend runner has and only
# continuous integration lacks, is `only_in_ci = true`: accepted only where GitHub Actions says it
# is running. A reason that names a path inside the checkout writes the checkout as {checkout},
# so it reads the same in every checkout. A cause always states an absence; a skip with nothing
# to check it against is a [[skip]] of one named test.
#
# An entry is allowed, not required: a tree that can run the test runs it.

profile = "exulanica.expected-skips/v2"

