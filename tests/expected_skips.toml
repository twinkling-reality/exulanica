# -- Causes: what a checkout without this machine's retained data or the optional extras skips --
#
# Continuous integration installs no optional extra, checks out tracked files only and has no
# retained evidence, so these are the reasons its tests skip. On a machine that holds what a
# reason says is missing, the reason is refused.

