<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>Exulanica</title>
    <meta
      name="description"
      content="Worlds for AI Agents. Every historical claim resolves to its source."
    />
    <!--
      Not indexed. This surface renders somebody's photograph library and every path through it
      requires a credential; a crawler that reached it would get a 401 and index the refusal.
    -->
    <meta name="robots" content="noindex, nofollow" />
    <script>
      try {
        const saved = JSON.parse(
          localStorage.getItem('exulanica.atlas.preferences.v1') || '{}',
        );
        document.documentElement.dataset.theme = 'dawn';
        document.documentElement.dataset.uiScheme = ['dark', 'system'].includes(saved.scheme)
          ? saved.scheme
          : 'light';
        document.documentElement.dataset.contrast = saved.contrast === 'high' ? 'high' : 'standard';
        document.documentElement.dataset.transparency = saved.transparency === 'reduced'
          ? 'reduced'
          : 'layered';
        document.documentElement.style.colorScheme = 'light';
      } catch {}
      // A world's own address (not a scene preview) opens on the opening's dark ground from its first frame, with the
      // picture the front door handed over where there is one, never a white page or words of its own, until the
      // workspace's opening (world-opening.ts) takes the screen and clears this.
      try {
        const address = new URLSearchParams(location.search);
        const entry = address.get('entry');
        if (entry && address.get('capture') !== '1' && address.get('livePreview') !== '1') {
          document.documentElement.dataset.opening = '';
          const handoff = JSON.parse(sessionStorage.getItem('exulanica.opening.v1') || 'null');
          if (handoff && handoff.entryId === entry && typeof handoff.picture === 'string' && handoff.picture.startsWith('data:image/')) {
            document.documentElement.style.backgroundImage = `url(${JSON.stringify(handoff.picture)})`;
          }
        }
      } catch {}
    </script>
    <style>
      html[data-opening] { background: #0c1216 center / cover no-repeat fixed; }
      html[data-opening] body { visibility: hidden; }
      html[data-opening] .gate { visibility: visible; }
    </style>
  </head>
  <body>
    <!--
      One canvas, created once and never torn down. The shell moves it between layouts rather
      than constructing a second one: interaction-model.md 1.1 has no scene loading, no "enter"
      and no "return", and a canvas that was recreated on a view change would be all three.

      Decorative to assistive technology. Everything the Atlas shows is reachable from the
      library rail and the detail pane, which is the accessibility route and the default entry on
      touch, where Pointer Lock does not exist at all.
    -->
    <canvas id="atlas" aria-hidden="true"></canvas>
    <div id="shell" data-booting></div>
    <script type="module" src="/src/bootstrap.ts"></script>
  </body>
</html>
