<!doctype html>
<html lang="en" data-theme="landing-light">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="canonical" href="https://exulanica.com/" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Exulanica</title>
    <meta
      name="description"
      content="Exulanica is a personal world memory model. It gathers the photographs, people, places, and moments of a life into one world."
    />

    <!--
      Link previews. The card image is a render of this page's own title screen, with the
      navigation and publisher mark removed; nothing is drawn here that the page does not draw.

      Absolute, against the registered origin. These were root-relative with no og:url while no
      public origin existed; exulanica.com was registered on 2026-09-15 and is now the canonical
      one. Several scrapers refuse a relative og:image outright, so a share card is only reliable
      once this is a full URL. Moving the site means changing these four values.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://exulanica.com/" />
    <meta property="og:site_name" content="Exulanica" />
    <meta property="og:title" content="Exulanica" />
    <meta
      property="og:description"
      content="Exulanica is a personal world memory model. It gathers the photographs, people, places, and moments of a life into one world."
    />
    <meta property="og:image" content="https://exulanica.com/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The Exulanica wordmark over two soft overlapping fields of blue, yellow, and green light."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Exulanica" />
    <meta
      name="twitter:description"
      content="Exulanica is a personal world memory model. It gathers the photographs, people, places, and moments of a life into one world."
    />
    <meta name="twitter:image" content="https://exulanica.com/og-image.png" />
  </head>
  <body>
    <!-- The title and informational pages share Exulanica's neutral signed-out canvas. -->
    <main id="overlay"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
