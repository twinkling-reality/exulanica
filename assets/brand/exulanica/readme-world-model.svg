<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="432" viewBox="0 0 1200 432" role="img" aria-labelledby="title desc">
  <title id="title">Worlds for AI Agents</title>
  <desc id="desc">Product direction. A world you build sits at the centre, and open models run the agents in it, each model in its own role. Swap the model behind a role, compare the two runs side by side and replay every decision. Hand building, photographs and imported content are ways to build the world.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#597365" opacity=".12"/>
    </pattern>
    <linearGradient id="world" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#234c43"/>
      <stop offset="1" stop-color="#142c28"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="432" rx="18" fill="#f2f5ef"/>
  <rect width="1200" height="432" rx="18" fill="url(#grid)"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="44" y="44" font-size="12" font-weight="700" letter-spacing="2.5" fill="#466756">EXULANICA / PRODUCT DIRECTION</text>
    <text x="44" y="84" font-size="29" font-weight="600" fill="#203a32">Worlds for AI Agents.</text>

    <text x="44" y="138" font-size="12" font-weight="700" letter-spacing="1.5" fill="#6d8577">WAYS TO BUILD</text>
    <text x="900" y="138" font-size="12" font-weight="700" letter-spacing="1.5" fill="#6d8577">SEE THE DIFFERENCE</text>

    <g fill="none" stroke="#9fb2a3" stroke-width="1.5">
      <path d="M264 180H300V264H340M264 264H340M264 348H300V264"/>
      <path d="M860 264H880V180H900M860 264H900M880 264V348H900"/>
    </g>

    <g fill="#fff" stroke="#d1dbce">
      <rect x="44" y="152" width="220" height="56" rx="9"/>
      <rect x="44" y="236" width="220" height="56" rx="9"/>
      <rect x="44" y="320" width="220" height="56" rx="9"/>
      <rect x="900" y="152" width="256" height="56" rx="9"/>
      <rect x="900" y="236" width="256" height="56" rx="9"/>
      <rect x="900" y="320" width="256" height="56" rx="9"/>
    </g>
    <g font-size="16" fill="#294438">
      <text x="64" y="186">By hand, from catalogs</text>
      <text x="64" y="270">From your photographs</text>
      <text x="64" y="354">Imported, origin labelled</text>
      <text x="920" y="186">Swap the model in a role</text>
      <text x="920" y="270">Compare runs side by side</text>
      <text x="920" y="354">Replay every decision</text>
    </g>

    <rect x="340" y="122" width="520" height="284" rx="14" fill="url(#world)"/>
    <text x="600" y="156" text-anchor="middle" font-size="22" font-weight="600" fill="#f5f8ef">Your world</text>
    <text x="600" y="180" text-anchor="middle" font-size="14" fill="#b9cfc1">places, objects and the agents that act in them</text>

    <g font-size="14" font-weight="600" text-anchor="middle">
      <rect x="392" y="200" width="160" height="34" rx="17" fill="#ded88f"/>
      <text x="472" y="222" fill="#2d3a1f">Open model A</text>
      <rect x="648" y="200" width="160" height="34" rx="17" fill="#9fcfb0"/>
      <text x="728" y="222" fill="#17352b">Open model B</text>
    </g>

    <g stroke-width="1.2" opacity=".85">
      <path d="M472 234V256M430 256H514M430 256V272M472 256V272M514 256V272" fill="none" stroke="#ded88f"/>
      <path d="M728 234V256M686 256H770M686 256V272M728 256V272M770 256V272" fill="none" stroke="#9fcfb0"/>
    </g>
    <g>
      <circle cx="430" cy="282" r="9" fill="#ded88f"/>
      <circle cx="472" cy="282" r="9" fill="#ded88f"/>
      <circle cx="514" cy="282" r="9" fill="#ded88f"/>
      <circle cx="686" cy="282" r="9" fill="#9fcfb0"/>
      <circle cx="728" cy="282" r="9" fill="#9fcfb0"/>
      <circle cx="770" cy="282" r="9" fill="#9fcfb0"/>
    </g>
    <g font-size="13" fill="#d8e5dc" text-anchor="middle">
      <text x="472" y="314">people in one group</text>
      <text x="728" y="314">people in another group</text>
    </g>

    <path d="M372 336H828" stroke="#4f7466" stroke-width="1"/>
    <text x="600" y="362" text-anchor="middle" font-size="14" fill="#f5f8ef">Each model does what it is good at. The engine checks every decision.</text>
    <text x="600" y="386" text-anchor="middle" font-size="13" fill="#b9cfc1">Every decision is stored, so a run replays without calling a model.</text>
  </g>
</svg>
